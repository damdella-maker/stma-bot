# Entonnoir de traders memecoins (copie en argent fictif) : toutes les 30 min, données publiques uniquement, aucun secret.
# Résultat publié sur la branche « funnel-data » (un seul commit, écrasé à chaque passage) ; le Worker lit short.json.
name: funnel
on:
  schedule: [{ cron: '7,37 * * * *' }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: funnel, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: état précédent
        run: git fetch origin funnel-data --depth=1 && git worktree add data origin/funnel-data || mkdir -p data
      - name: entonnoir
        env: { FUNNEL_MINUTES: '9' }
        run: node funnel/funnel.mjs data
      - name: publication
        run: |
          cd data && rm -rf .git_tmp
          git init -q -b funnel-data tmp && cp state.json.gz analyzed.json.gz short.json tmp/ && cd tmp
          git config user.name 'funnel-bot' && git config user.email 'actions@users.noreply.github.com'
          git add -A && git commit -q -m "entonnoir $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" funnel-data
